name: LPE LinkedIn Post Agent

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Monday + Thursday 8am Berlin (6am UTC)
  workflow_dispatch:          # Manual trigger in GitHub UI

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger LPE LinkedIn Post Agent
        run: |
          curl -v https://api.anthropic.com/v1/sessions \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d '{
              "agent_id": "agent_011CZzUzwxyAs7HZ8hHFzG67",
              "environment_id": "env_01AKkfDeP5JfCzFfCcQ9bGXX"
            }'

      - name: Confirm
        run: echo "LinkedIn Post Agent triggered — check Notion Post Bank for drafts."
