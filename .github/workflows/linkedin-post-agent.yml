name: LPE LinkedIn Post Agent

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Monday + Thursday 8am Berlin (6am UTC)
  workflow_dispatch:

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger LinkedIn Post Agent
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST https://api.anthropic.com/v1/sessions \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d '{"agent": "agent_011Ca1YGqDiJNGXeQA1webuZ", "environment_id": "env_01AKkfDeP5JfCzFfCcQ9bGXX"}')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -gt 299 ]; then
            echo "ERROR: API call failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Agent triggered successfully."
